version: '3.8'

services:
  ascii-directory:
    build:
      context: .
      dockerfile: Dockerfile
    image: ascii-directory:latest
    container_name: ascii-directory
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
      - JWT_SECRET=${JWT_SECRET:-change_this_random_secret_string}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/system/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
